; ============================================
; DBService v1.1 — 数据库与服务配置文件
; 路径：config/DBConfig.ini
; 缺失时使用内置默认值，可正常启动
; ============================================

[Database]
; 数据库驱动类型（支持：MySQL / Oracle / ODBC / PostgreSQL / SQLite / DB2）
driverType=MySQL
; 数据库主机地址（默认 127.0.0.1）
host=127.0.0.1
; 端口号（默认 3306）
port=3306
; 数据库名称（必填）
dbName=
; 登录用户名（默认 root）
user=root
; 登录密码（必填）
password=
; 是否开启连接断线重试（默认 true）
enableRetry=true
; 最大重试次数（limitRetryCount=true 时生效，默认 3 次）
retryTimes=3
; 重试间隔毫秒数（默认 2000ms）
retryIntervalMs=2000
; 是否限制重试次数（true=有限重试，false=无限重试，默认 true）
limitRetryCount=true

[Service]
; 服务类型（Reliable / HighPerf / Standard / Unreliable，默认 Reliable）
; Reliable   = 无限重试，保证 SQL 正确时 100% 执行
; HighPerf   = 批量入队 + 短间隔，适合高频场景
; Standard   = 有限重试，折中策略
; Unreliable = 不重试，只执行一次
serviceType=Reliable
