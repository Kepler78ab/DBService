; ============================================
; DBService v1.1 — 日志配置文件
; 路径：config/LogConfig.ini
; 缺失时使用内置默认值，可正常启动
; ============================================

[Log]
; 日志输出目录（支持相对/绝对路径）
; 相对路径相对于 exe 所在目录，绝对路径直接使用
; 默认：service_log
logDir=service_log

; 日志刷盘间隔（毫秒），定时将缓存写入文件
; 默认：30000（30 秒）
flushIntervalMs=30000
