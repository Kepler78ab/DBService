[Database]
; ============================================
; 数据库连接配置
; ============================================
driverType=MySQL              ; 数据库驱动类型：
                              ;   MySQL        -> QMYSQL
                              ;   Oracle       -> QOCI
                              ;   ODBC         -> QODBC
                              ;   PostgreSQL   -> QPSQL
                              ;   SQLite       -> QSQLITE
                              ;   DB2          -> QDB2

host=127.0.0.1                ; 数据库服务器地址
port=3306                     ; 数据库端口号
dbName=test_db                ; 数据库名称
user=root                     ; 用户名
password=123456               ; 密码

; ============================================
; 连接重连配置（数据库连接层）
; ============================================
enableRetry=true              ; 是否开启连接失败重连
retryTimes=3                  ; 单次重连间隔内的尝试次数（仅limitRetryCount=true时有效）
retryIntervalMs=2000          ; 重连间隔（毫秒）
limitRetryCount=false         ; 是否限制重连次数（true=限制，false=无限次重连）

[TaskManager]
; ============================================
; 任务队列配置
; ============================================
queueMaxSize=100              ; 任务队列最大容量
queueFullPolicy=REJECT        ; 队列满策略：BLOCK(阻塞) / REJECT(拒绝)

; ============================================
; 重试策略配置（任务执行层）
; ============================================
retryMode=LimitedRetry        ; 任务重试模式：
                              ;   NoRetry       - 不重试
                              ;   LimitedRetry  - 有限重试
                              ;   ForeverRetry  - 永久重试

maxRetryCount=3               ; 最大重试次数（LimitedRetry模式生效）
retryIntervalMs=3000          ; 重试间隔（毫秒）

; ============================================
; 任务延时配置
; ============================================
enableTaskDelay=false         ; 是否开启任务延时执行
taskDelayMs=0                 ; 任务延时时长（毫秒）

; ============================================
; 批量入队配置
; ============================================
enableBatchEnqueue=true       ; 是否开启批量入队
batchIntervalMs=1000          ; 批量入队间隔（毫秒）
batchMaxSize=10               ; 单次最大批量大小