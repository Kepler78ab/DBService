[Database]
; ============================================
; 数据库连接配置
; ============================================
driverType=MySQL              ; 数据库驱动类型：
                              ;   MySQL        -> QMYSQL
                              ;   Oracle       -> QOCI
                              ;   ODBC         -> QODBC
                              ;   PostgreSQL   -> QPSQL
                              ;   SQLite       -> QSQLITE
                              ;   DB2          -> QDB2

host=127.0.0.1                ; 数据库服务器地址
port=3306                     ; 数据库端口号
dbName=test_db                ; 数据库名称
user=root                     ; 用户名
password=123456               ; 密码

; ============================================
; 连接重连配置（数据库连接层）
; ============================================
enableRetry=true              ; 是否开启连接失败重连
retryTimes=3                  ; 单次重连间隔内的尝试次数（仅limitRetryCount=true时有效）
retryIntervalMs=2000          ; 重连间隔（毫秒）
limitRetryCount=false         ; 是否限制重连次数（true=限制，false=无限次重连）

[Service]
; ============================================
; 服务类型配置
; ============================================
serviceType=Reliable          ; 服务类型：
                              ;   Reliable    - 可靠模式（ForeverRetry，保证执行）
                              ;   HighPerf    - 高性能模式（批量入队，适合高频场景）
                              ;   Unreliable  - 不可靠模式（NoRetry，只执行一次）
                              ;
                              ; 注意：Standard模式请使用 StandardConfig.ini